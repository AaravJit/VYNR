plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vynrredaction'
version = '1.0.0'

android {
  namespace "expo.modules.vynrredaction"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bundled (not Play-services-downloaded) models so detection works offline on first launch.
  implementation 'com.google.mlkit:face-detection:16.1.7'
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
